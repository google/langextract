name: Revalidate PR

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to validate'
        required: true
        type: string

permissions: {}

jobs:
  revalidate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      statuses: write
    env:
      MAX_PR_LINES: '1000'
    steps:
      - name: Get PR data
        id: pr_data
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const rawPrNumber = (process.env.PR_NUMBER || '').trim();
            if (!/^[1-9]\d*$/.test(rawPrNumber)) {
              core.setFailed('Invalid PR number; expected a positive integer.');
              return;
            }
            const prNumber = Number(rawPrNumber);
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });

            core.info(`Validating PR #${pr.number}: ${pr.title}`);
            core.info(`Author: ${pr.user.login}`);
            core.info(`Changes: +${pr.additions} -${pr.deletions}`);

            const prPath = path.join(process.env.RUNNER_TEMP, 'revalidate-pr.json');
            fs.writeFileSync(prPath, JSON.stringify(pr), 'utf8');
            core.setOutput('pr_path', prPath);
            core.setOutput('pr_number', String(pr.number));
            core.setOutput('head_sha', pr.head.sha);

      - name: Create pending status
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          HEAD_SHA: ${{ steps.pr_data.outputs.head_sha }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.HEAD_SHA,
              state: 'pending',
              context: 'Manual Validation',
              description: 'Running validation checks...'
            });

      - name: Validate PR
        id: validate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PR_PATH: ${{ steps.pr_data.outputs.pr_path }}
        with:
          script: |
            const fs = require('fs');
            const pr = JSON.parse(fs.readFileSync(process.env.PR_PATH, 'utf8'));
            const errors = [];
            let passed = true;

            const totalChanges = pr.additions + pr.deletions;
            const maxPrLines = Number(process.env.MAX_PR_LINES);
            if (totalChanges > maxPrLines) {
              errors.push(`PR size (${totalChanges} lines) exceeds ${maxPrLines} line limit`);
              passed = false;
            }

            // Strip HTML comments and code spans/fences so hidden tokens cannot satisfy checks.
            const rawBody = pr.body || '';
            const visibleBody = rawBody
              .replace(/<!--[\s\S]*?-->/g, '')
              .replace(/```[\s\S]*?```/g, '')
              .replace(/`[^`]*`/g, '');

            const requiredSections = [
              '# Description',
              'Fixes #',
              '# How Has This Been Tested?',
              '# Checklist',
            ];
            const missingSections = requiredSections.filter(section => !visibleBody.includes(section));

            if (missingSections.length > 0) {
              errors.push(`Missing PR template sections: ${missingSections.join(', ')}`);
              passed = false;
            }

            if (rawBody.match(/Replace this with|Choose one:|Fixes #\[issue number\]/i)) {
              errors.push('PR template contains unmodified placeholders');
              passed = false;
            }

            const issueMatch = visibleBody.match(/(?:Fixes|Closes|Resolves)\s+#(\d+)/i);
            if (!issueMatch) {
              errors.push('No linked issue found');
              passed = false;
            }

            core.setOutput('passed', passed);
            core.setOutput('errors', errors.join('; '));
            core.setOutput('totalChanges', totalChanges);
            core.setOutput('hasTemplate', missingSections.length === 0);
            core.setOutput('hasIssue', !!issueMatch);

            if (!passed) {
              core.setFailed(errors.join('; '));
            }

      - name: Update commit status
        if: always() && steps.pr_data.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PASSED: ${{ steps.validate.outputs.passed }}
          ERRORS: ${{ steps.validate.outputs.errors }}
          HEAD_SHA: ${{ steps.pr_data.outputs.head_sha }}
        with:
          script: |
            const passed = process.env.PASSED === 'true';
            const errors = process.env.ERRORS || '';

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.HEAD_SHA,
              state: passed ? 'success' : 'failure',
              context: 'Manual Validation',
              description: passed ? 'All validation checks passed' : (errors || 'Validation step failed').substring(0, 140),
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - name: Add validation comment
        if: always() && steps.pr_data.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PR_NUMBER: ${{ steps.pr_data.outputs.pr_number }}
          PASSED: ${{ steps.validate.outputs.passed }}
          TOTAL_CHANGES: ${{ steps.validate.outputs.totalChanges }}
          HAS_TEMPLATE: ${{ steps.validate.outputs.hasTemplate }}
          HAS_ISSUE: ${{ steps.validate.outputs.hasIssue }}
          ERRORS: ${{ steps.validate.outputs.errors }}
        with:
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            const passed = process.env.PASSED === 'true';
            const totalChanges = Number(process.env.TOTAL_CHANGES || '0');
            const maxPrLines = Number(process.env.MAX_PR_LINES);
            const hasTemplate = process.env.HAS_TEMPLATE === 'true';
            const hasIssue = process.env.HAS_ISSUE === 'true';
            const errors = (process.env.ERRORS || '').split('; ').filter(e => e);

            let body = `### Manual Validation Results\n\n`;
            body += `**Status**: ${passed ? '✅ Passed' : '❌ Failed'}\n\n`;
            body += `| Check | Status | Details |\n`;
            body += `|-------|--------|----------|\n`;
            body += `| PR Size | ${totalChanges <= maxPrLines ? '✅' : '❌'} | ${totalChanges} lines ${totalChanges > maxPrLines ? `(exceeds ${maxPrLines} limit)` : ''} |\n`;
            body += `| Template | ${hasTemplate ? '✅' : '❌'} | ${hasTemplate ? 'Complete' : 'Missing required sections'} |\n`;
            body += `| Linked Issue | ${hasIssue ? '✅' : '❌'} | ${hasIssue ? 'Found' : 'Missing Fixes/Closes #XXX'} |\n`;

            if (errors.length > 0) {
              body += `\n**Errors:**\n`;
              for (const error of errors) {
                body += `- ❌ ${error}\n`;
              }
            }

            body += `\n[View workflow run](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            });

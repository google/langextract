[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "langextract-local-skills-prototype"
version = "0.0.1"
requires-python = ">=3.10"
dependencies = ["langextract>=1.7.2,<2", "PyYAML>=6", "markitdown[pptx]==0.1.6", "defusedxml>=0.7"]

[tool.setuptools]
packages = ["langextract_skills"]
